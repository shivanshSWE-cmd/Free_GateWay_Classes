  function cleanTitle(str) {
    return str
      .replace(/_/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function formatLectureTitle(key) {
    let clean = cleanTitle(key);

    if (/alllectures/i.test(key)) {
      return "All Lectures & Notes (Unit 3, 4 & 5 Complete Folder / Zip)";
    }

    const rangeMatch = key.match(/lec(\d+)_(\d+)_notes/i);
    if (rangeMatch) {
      return `Lecture ${rangeMatch[1]} to ${rangeMatch[2]} Notes`;
    }
    const tripleMatch = key.match(/lec(\d+)_(\d+)_(\d+)_notes/i);
    if (tripleMatch) {
      return `Lecture ${tripleMatch[1]}, ${tripleMatch[2]} & ${tripleMatch[3]} Notes`;
    }

    const codePartMatch = key.match(/lec(\d+)_code(\d+)/i);
    if (codePartMatch) {
      return `Lecture ${codePartMatch[1]} Code (Part ${codePartMatch[2]})`;
    }
    const codeMatch = key.match(/lec(\d+)_code/i);
    if (codeMatch) {
      return `Lecture ${codeMatch[1]} Source Code`;
    }

    const v2Match = key.match(/lec(\d+)_notes_v2/i);
    if (v2Match) {
      return `Lecture ${v2Match[1]} Notes (Updated / v2)`;
    }
    if (/one_shot_notes_v2/i.test(key)) {
      return "One Shot Notes (Updated / v2)";
    }

    if (/one_shot_notes_1/i.test(key)) return "One Shot Revision Notes (Part 1)";
    if (/one_shot_notes_2/i.test(key)) return "One Shot Revision Notes (Part 2)";
    if (/one_shot_final_notes/i.test(key)) return "One Shot Final Revision Notes";
    if (/compact_one_shot_notes/i.test(key)) return "Compact One Shot Notes";
    if (/oneshot|one_shot|oneshort/i.test(clean)) return "One Shot Revision Notes";

    if (/combined_dpp/i.test(key)) return "Combined DPP Solutions";
    const dppSolMatch = key.match(/dpp_?(\d+)_sol/i);
    if (dppSolMatch) return `DPP ${dppSolMatch[1]} Solution`;
    const dppMatch = key.match(/^dpp_?(\d+)$/i);
    if (dppMatch) return `DPP ${dppMatch[1]} Problems`;

    if (/unmarked_combined_notes/i.test(key)) return "Combined Notes (Unmarked)";
    if (/combined_notes|combinednotes/i.test(key)) return "Combined Full Unit Notes";
    if (/handwritten_notes|hand_written_notes/i.test(key)) return "Handwritten Notes";
    if (/complete_notes/i.test(key)) return "Complete Unit Notes";

    const singleLecMatch = key.match(/^lec_?(\d+)_notes$/i) || key.match(/^lec_?(\d+)$/i);
    if (singleLecMatch) return `Lecture ${singleLecMatch[1]} Notes`;

    if (/pyq.*5.*year/i.test(key)) return "Last 5 Years AKTU PYQ";
    if (/pyq.*3.*year/i.test(key)) return "Last 3 Years AKTU PYQ";
    if (/10.*year.*pyq/i.test(key)) return "Last 10 Years AKTU PYQ";
    if (/most_imp_questions/i.test(key)) return "Most Important Questions";
    if (/imp_questions_2425/i.test(key)) return "Important Questions (2024-25)";
    if (/imp_questions|important_questions/i.test(key)) return "Important Questions & PYQ";
    if (/syllabus_intro/i.test(key)) return "Syllabus & Introduction";

    const emojiMatch = key.match(/(?:[0-9]|🔟|1️⃣|2️⃣|3️⃣|4️⃣|5️⃣|6️⃣|7️⃣|8️⃣|9️⃣)+.*lec(\d+)/i);
    if (emojiMatch) return `Lecture ${emojiMatch[1]} Notes`;

    const hwMatch = key.match(/unit(\d+)_handwritten/i);
    if (hwMatch) return `Unit ${hwMatch[1]} Handwritten Notes`;

    const unitOnlyMatch = key.match(/^unit(\d+)$/i);
    if (unitOnlyMatch) return `Unit ${unitOnlyMatch[1]} Complete Notes`;

    return clean.replace(/\b\w/g, c => c.toUpperCase());
  }

  function getNoteIcon(title, key = "") {
    const t = (title + " " + key).toLowerCase();
    if (t.includes("zip") || t.includes("alllectures") || t.includes("folder")) return "📦";
    if (t.includes("code")) return "💻";
    if (t.includes("one shot") || t.includes("oneshot") || t.includes("oneshort")) return "⚡";
    if (t.includes("dpp") || t.includes("solution") || t.includes("sol")) return "📝";
    if (t.includes("combined") || t.includes("complete") || t.includes("full")) return "📚";
    if (t.includes("pyq") || t.includes("important") || t.includes("question") || t.includes("imp")) return "🎯";
    return "📄";
  }

  function formatCategoryName(key) {
    let clean = cleanTitle(key);

    const tripleUnitMatch = key.match(/unit\s*(\d+).*?unit\s*(\d+).*?unit\s*(\d+)/i);
    if (tripleUnitMatch) {
      const isZip = /zip/i.test(key);
      return `Unit ${tripleUnitMatch[1]}, ${tripleUnitMatch[2]} & ${tripleUnitMatch[3]}${isZip ? ' (Combined Zip)' : ''}`;
    }

    const doubleUnitMatch = key.match(/unit\s*(\d+).*?unit\s*(\d+)/i);
    if (doubleUnitMatch) {
      const isZip = /zip/i.test(key);
      return `Unit ${doubleUnitMatch[1]} & ${doubleUnitMatch[2]}${isZip ? ' (Combined Zip)' : ''}`;
    }

    const rangeUnitMatch = key.match(/unit\s*(\d+)\s*(?:to|-)\s*(\d+)/i);
    if (rangeUnitMatch) {
      return `Unit ${rangeUnitMatch[1]} to ${rangeUnitMatch[2]}`;
    }

    const singleUnitMatch = key.match(/^unit\s*(\d+)/i) || key.match(/unit\s*(\d+)/i);
    if (singleUnitMatch) {
      const isZip = /zip/i.test(key);
      return `Unit ${singleUnitMatch[1]}${isZip ? ' (Zip)' : ''}`;
    }

    if (/oddsemester/i.test(key)) return "Odd Semester PYQ";
    if (/evensemester/i.test(key)) return "Even Semester PYQ";
    if (/importantquestions|important_questions|imp_questions/i.test(key)) return "Important Questions & PYQ";
    if (/physicspyq/i.test(key)) return "Physics PYQ";
    if (/mechfme/i.test(key)) return "Mechanical (FME) Important";
    if (/unit\s*waise\s*pyq/i.test(key)) return "Maths 1 Unit-Wise PYQ";
    if (/maths\s*2\s*important/i.test(key)) return "Maths 2 Important Questions";

    return clean.replace(/\b\w/g, c => c.toUpperCase());
  }

  function extractNotes(obj, path = []) {
    let notes = [];
    for (let key in obj) {
      const val = obj[key];
      if (typeof val === "string") {
        notes.push({
          group: path.length > 0 ? path[0] : "General",
          subGroup: path.slice(1).join(" • "),
          key: key,
          url: val
        });
      } else if (typeof val === "object" && val !== null) {
        notes.push(...extractNotes(val, [...path, key]));
      }
    }
    return notes;
  }

      header.className = 'subject-card-header';
      header.innerHTML = `
        <div class="header-left">
          <div class="subject-icon-box">${meta.icon}</div>
          <div class="subject-title-area">
            <h2>${meta.title}</h2>
            <div class="subject-meta">${groupKeys.length} Categories • ${allNotes.length} Study Files</div>
          </div>
        </div>
        <div class="header-right">
          <span class="badge-count">${meta.badge}</span>
          <span class="chevron-icon">▼</span>
        </div>
      `;
      header.onclick = () => {
        card.classList.toggle('open');
      };
      card.appendChild(header);

      const content = document.createElement('div');
      content.className = 'subject-content';

      const unitTabs = document.createElement('div');
      unitTabs.className = 'unit-tabs';
      unitTabs.innerHTML = `<button class="unit-tab-btn active" data-group="all">All (${allNotes.length})</button>`;
      groupKeys.forEach(gKey => {
        const count = groupMap[gKey].length;
        unitTabs.innerHTML += `<button class="unit-tab-btn" data-group="${gKey}">${formatCategoryName(gKey)} (${count})</button>`;
      });

      unitTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('.unit-tab-btn');
        if (!btn) return;
        unitTabs.querySelectorAll('.unit-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const targetGroup = btn.dataset.group;
        const notesGrid = content.querySelector('.notes-grid');
        notesGrid.querySelectorAll('.note-card-link').forEach(noteEl => {
          if (targetGroup === 'all' || noteEl.dataset.group === targetGroup) {
            noteEl.style.display = 'flex';
          } else {
            noteEl.style.display = 'none';
          }
        });
      });
      content.appendChild(unitTabs);

      const notesGrid = document.createElement('div');
      notesGrid.className = 'notes-grid';

      allNotes.forEach(n => {
        const rawTitle = formatLectureTitle(n.key);
        const groupLabel = formatCategoryName(n.group);
        const icon = getNoteIcon(rawTitle, n.key);
        const isZip = /zip|alllectures/i.test(n.key) || /zip/i.test(n.group);
        const typeTag = isZip ? "MediaFire Zip Folder" : "Direct PDF";
        const subLabel = n.subGroup ? `${groupLabel} • ${formatCategoryName(n.subGroup)}` : `${groupLabel} • ${typeTag}`;
        const actionLabel = isZip ? "Open Zip ➔" : "Download ➔";

        const noteLink = document.createElement('a');
        noteLink.href = n.url;
        noteLink.target = '_blank';
        noteLink.rel = 'noopener';
        noteLink.className = 'note-card-link';
        noteLink.dataset.subject = sKey;
        noteLink.dataset.group = n.group;
        noteLink.dataset.search = `${meta.title} ${meta.badge} ${groupLabel} ${n.subGroup} ${rawTitle} ${n.key}`.toLowerCase();
        noteLink.innerHTML = `
          <div class="note-card-left">
            <span class="note-type-icon">${icon}</span>
            <div class="note-text-details">
              <span class="note-name">${rawTitle}</span>
              <span class="note-sub">${subLabel}</span>
            </div>
          </div>
          <span class="note-open-badge">${actionLabel}</span>
        `;
        notesGrid.appendChild(noteLink);
      });

      content.appendChild(notesGrid);
      card.appendChild(content);
      subjectsListEl.appendChild(card);
      if (typeof window.__gwcMaybeAd === 'function') window.__gwcMaybeAd('subjectsList', idx);
    });

    resultsText.textContent = `Showing all ${subjectKeys.length} subjects (${totalNotesAcrossAll} notes available)`;
  }

  function selectSubjectFilter(sKey) {
    activeSubjectFilter = sKey;

    subjectChipsEl.querySelectorAll('.subject-chip').forEach(c => {
      if ((sKey === 'all' && !c.dataset.subject) || c.dataset.subject === sKey) {
        c.classList.add('active');
        c.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      } else {
        c.classList.remove('active');
      }
    });

    searchInput.value = '';
    clearSearchBtn.style.display = 'none';
    noResultsEl.style.display = 'none';

    const cards = subjectsListEl.querySelectorAll('.subject-card');
    cards.forEach(card => {
      if (sKey === 'all' || card.dataset.subject === sKey) {
        card.style.display = 'block';
        if (sKey !== 'all') {
          card.classList.add('open');
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      } else {
        card.style.display = 'none';
      }
    });

    if (sKey === 'all') {
      resultsText.textContent = `Showing all subjects`;
    } else {
      const meta = subjectMeta[sKey] || {};
      resultsText.textContent = `Showing subject: ${meta.title || sKey}`;
    }
  }

  function handleSearch() {
    const q = searchInput.value.trim().toLowerCase();
    clearSearchBtn.style.display = q.length > 0 ? 'flex' : 'none';

    if (!q) {
      selectSubjectFilter(activeSubjectFilter);
      return;
    }

    subjectChipsEl.querySelectorAll('.subject-chip').forEach(c => c.classList.remove('active'));

    let matchedCardsCount = 0;
    let totalMatchedNotes = 0;

    const cards = subjectsListEl.querySelectorAll('.subject-card');
    cards.forEach(card => {
      const notes = card.querySelectorAll('.note-card-link');
      let cardHasMatch = false;

      notes.forEach(n => {
        const searchText = n.dataset.search || '';
        if (searchText.includes(q)) {
          n.style.display = 'flex';
          cardHasMatch = true;
          totalMatchedNotes++;
        } else {
          n.style.display = 'none';
        }
      });

      if (cardHasMatch) {
        card.style.display = 'block';
        card.classList.add('open');
        matchedCardsCount++;
      } else {
        card.style.display = 'none';
      }
    });

    if (matchedCardsCount === 0) {
      noResultsEl.style.display = 'block';
      resultsText.textContent = `0 results found for "${q}"`;
    } else {
      noResultsEl.style.display = 'none';
      resultsText.textContent = `Found ${totalMatchedNotes} notes in ${matchedCardsCount} subjects for "${q}"`;
    }
  }

  searchInput.addEventListener('input', handleSearch);

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    handleSearch();
    searchInput.focus();
  });

  toggleAllBtn.addEventListener('click', () => {
    allExpanded = !allExpanded;
    const cards = subjectsListEl.querySelectorAll('.subject-card');
    cards.forEach(card => {
      if (allExpanded) {
        card.classList.add('open');
      } else {
        card.classList.remove('open');
      }
    });
    toggleAllBtn.textContent = allExpanded ? 'Collapse All' : 'Expand All';
  });

  initHub();
</script>
<script>
    
document.addEventListener('contextmenu', event => event.preventDefault());
</script>

<script src="site-ads.js"></script>
